<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bàn giao vận chuyển | Sobie</title>
<style>body{font:16px system-ui,sans-serif;max-width:850px;margin:36px auto;padding:0 18px;background:#f8f7f4;color:#252525}article{background:#fff;border:1px solid #e7e2db;border-radius:12px;padding:16px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}button{font:inherit;padding:8px 12px;border:0;border-radius:7px;background:#262626;color:white;cursor:pointer}.error{color:#a21b1b}</style></head>
<body><h1>Bàn giao đơn cho vận chuyển</h1><p>UC-40 · Đơn đã xác nhận sẽ chuyển sang trạng thái “Chờ lấy hàng”.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% for order in orders %}<article><span>{{ order.order_code }}</span><span>{{ order.order_created_date.strftime('%d/%m/%Y %H:%M') }}</span><form method="post" action="/admin/shipping/{{ order.order_code }}/handoff" onsubmit="return confirm('Bàn giao {{ order.order_code }} cho vận chuyển?')"><button>Bàn giao vận chuyển</button></form></article>{% else %}<article>Không có đơn đang chờ bàn giao.</article>{% endfor %}</body></html>
