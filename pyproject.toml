[project]
name = "sobie-swimwear-e-commerce"
version = "0.1.0"
description = "Website bán đồ bơi Sobie — modular monolith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "sqlmodel (>=0.0.50,<0.0.51)",
    "sqlalchemy[asyncio] (>=2.0.14,<3.0.0)",
]

[dependency-groups]
test = ["pytest (>=8.3,<10)", "pytest-asyncio (>=0.24,<1)", "aiosqlite (>=0.20,<1)"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Cùng event loop cho cả session — tránh asyncpg "another operation is in progress"
# khi engine SQLAlchemy tạo ở import-time bị gắn loop đã đóng (function-scoped).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "manual: kiểm tra thủ công trên UI / trình duyệt, không chạy tự động đủ",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
