name: sobie-e-commerce-website

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sobie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sobieDB}
    ports:
      - "5432:5432"
    networks:
      - sobie_network
    volumes:
      - postgresdb:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./postgres/inventory-support.sql:/docker-entrypoint-initdb.d/03-inventory-support.sql:ro


networks:
  sobie_network:

volumes:
  postgresdb:
