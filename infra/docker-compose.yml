name: sobie-e-commerce-website

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sobie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sobie_admin}
      POSTGRES_DB: ${POSTGRES_DB:-sobieDB}
    ports:
      - "5432:5432"
    networks:
      - sobie_network
    volumes:
      - postgresdb:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass my_redis_password
    volumes:
      - redisdb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "my_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


networks:
  sobie_network:

volumes:
  postgresdb:
  redisdb:
