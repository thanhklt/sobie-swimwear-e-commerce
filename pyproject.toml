[project]
name = "sobie-swimwear-e-commerce"
version = "0.1.0"
description = "Website bán đồ bơi Sobie — modular monolith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.165.0,<0.166.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "sqlmodel (>=0.0.50,<0.0.51)",
    "sqlalchemy[asyncio] (>=2.0.14,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "authlib (>=1.9.10,<2.0.0)",
    "tzdata (>=2026.6,<2027.0) ; sys_platform == \"win32\"",
]

[dependency-groups]
test = ["pytest (>=8.3,<10)", "aiosqlite (>=0.20,<1)", "bcrypt (>=5.0.0,<6.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
