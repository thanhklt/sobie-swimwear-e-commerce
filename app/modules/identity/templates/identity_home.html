{% extends "account.html" %}
{% block title %}Sobie{% endblock %}
{% block account_content %}
  <h1 id="identity-title">Sobie</h1>
  {% if request.state.auth_session %}
    <p><a href="{{ request.url_for('customer_profile').path }}">Hồ sơ khách hàng</a></p>
    {% include "_logout.html" %}
  {% else %}
    <p><a href="{{ request.url_for('storefront_login').path }}">Đăng nhập</a></p>
    <p><a href="{{ request.url_for('registration_form').path }}">Đăng ký tài khoản</a></p>
  {% endif %}
{% endblock %}
